# DAY 19 - ConfigMap
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: busybox-new
  name: busybox-new
spec:
  containers:
  - image: busybox:1.28
    name: busybox-new
#-----------------------------------------------------------------------------------------------------------------------
    env:
    - name: FIRST_NAME
      valueFrom:
        configMapKeyRef:                     # This is how we can use the config map values as environment variables in our pod.
          name: my-config
          key: first_name
#-----------------------------------------------------------------------------------------------------------------------
    command: ["sh", "-c", "echo FIRST_NAME=$FIRST_NAME; sleep 3600"]  # This is how we can use the environment variable in the command section of the container spec. We can also use it in the args section as shown below.
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

