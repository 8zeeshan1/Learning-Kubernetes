# DAY 8 - Replication Controller:
apiVersion: v1
kind: Pod
metadata:
  name: nginx-rc
  labels:
    env: demo
    type: frontend
spec:
  template:
    metadata:
      name: nginx
      labels:
        env: demo
    spec:
      containers:
      - image: nginx
        name: nginx
  replicas: 3